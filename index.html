<title>Batty Casino</title>
<meta name="description" content="Batty Casino: free-to-play slots, live game shows, a High Roller Lounge and leaderboards, all played with Batty Bucks. No real money, just fun.">

<style>
/* Layout concept: a night sky that never changes behind a slim casino bar; the lobby is a shelf of tall
   cabinet marquees under a giant moon, and each game takes over the whole stage with its own world. */
:root {
  color-scheme: dark;
  --night: #100a1c;
  --dusk: #1d1033;
  --plum: #34195c;
  --violet: #6b3fd1;
  --moon: #ffd76a;
  --moon-deep: #f5a623;
  --fang: #ff3d81;
  --ecto: #58f0c8;
  --ink: #f7f0ff;
  --mute: #ab98c9;
  --line: rgba(255, 255, 255, .1);
  --glass: rgba(255, 255, 255, .06);
  --f-display: 'Titan One', 'Bowlby One', 'Arial Black', Impact, sans-serif;
  --f-body: 'Figtree', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  --f-num: 'Chakra Petch', 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --bar-h: 56px;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--moon); outline-offset: 2px; border-radius: 6px; }
#batty-app { min-height: 100%; display: flex; flex-direction: column; position: relative; }

/* ---------- top bar ---------- */
.bc-bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  height: var(--bar-h); flex: none;
  display: flex; align-items: center; gap: 10px;
  padding-inline: 12px;
  background: linear-gradient(180deg, rgba(16, 10, 28, .96), rgba(16, 10, 28, .86));
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
}
.bc-brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.bc-brand svg { width: 38px; height: 20px; flex: none; fill: var(--moon); filter: drop-shadow(0 0 8px rgba(255, 215, 106, .5)); }
.bc-brand b {
  font-family: var(--f-display); font-weight: 400; font-size: 18px; letter-spacing: .02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bc-back {
  display: flex; align-items: center; gap: 6px; height: 36px; padding-inline: 10px 12px; flex: none;
  border-radius: 999px; background: var(--glass); border: 1px solid var(--line);
  font-weight: 700; font-size: 13px;
}
.bc-back:hover { background: rgba(255, 255, 255, .12); }
.bc-back svg { width: 14px; height: 14px; }
.bc-bal {
  display: flex; align-items: center; gap: 7px; height: 38px; padding-inline: 6px 12px; flex: none;
  border-radius: 999px; background: linear-gradient(180deg, #2b1650, #1a0d33);
  border: 1px solid rgba(255, 215, 106, .45);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .4) inset, 0 0 18px rgba(255, 215, 106, .12);
  font-family: var(--f-num); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums;
  color: var(--moon);
}
.bc-bal.bump { animation: bc-bump .35s ease; }
@keyframes bc-bump { 40% { transform: scale(1.08); box-shadow: 0 0 26px rgba(255, 215, 106, .55); } }
.bc-coin {
  width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #fff3bd, var(--moon) 45%, var(--moon-deep) 100%);
  box-shadow: 0 0 0 2px #b9770e inset, 0 1px 3px rgba(0, 0, 0, .5);
}
.bc-coin svg { width: 17px; height: 9px; fill: #7a4a00; }
.bc-icon {
  width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center;
  background: var(--glass); border: 1px solid var(--line);
}
.bc-icon:hover { background: rgba(255, 255, 255, .12); }
.bc-icon svg { width: 18px; height: 18px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bc-lvl {
  flex: none; height: 38px; padding-inline: 10px; border-radius: 999px; display: flex; align-items: center; gap: 6px;
  background: var(--glass); border: 1px solid var(--line); font-family: var(--f-num); font-weight: 700; font-size: 13px;
}
.bc-lvl i { display: block; width: 44px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .14); overflow: hidden; }
.bc-lvl i::after { content: ''; display: block; height: 100%; width: var(--p, 0%); background: var(--ecto); border-radius: 3px; transition: width .4s; }
@media (max-width: 560px) { .bc-lvl, .bc-brand b.long { display: none; } .bc-bar { gap: 7px; padding-inline: 10px; } .bc-back span { display: none; } .bc-back { padding-inline: 10px; } }

/* ---------- stage (a game owns everything in here) ---------- */
.bc-stage { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
.bc-stage > * { flex: 1; }

/* ---------- lobby ---------- */
.bc-lobby {
  flex: 1; position: relative; overflow: hidden;
  background:
    radial-gradient(1200px 520px at 78% -140px, rgba(107, 63, 209, .55), transparent 70%),
    radial-gradient(700px 380px at 8% 0, rgba(255, 61, 129, .18), transparent 70%),
    linear-gradient(180deg, #170c2c 0, var(--night) 520px);
}
.bc-wrap { max-width: 1180px; margin-inline: auto; padding-inline: 16px; padding-block: 0 48px; position: relative; }
.bc-stars { position: absolute; inset: 0 0 auto 0; height: 520px; pointer-events: none; opacity: .9; }
.bc-hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; padding-block: 34px 30px; }
.bc-hero h1 {
  margin: 0; font-family: var(--f-display); font-weight: 400; line-height: .88; letter-spacing: .01em;
  font-size: clamp(54px, 11vw, 124px); text-wrap: balance;
  color: var(--moon);
  text-shadow: 0 2px 0 #c9860f, 0 5px 0 #8a4f06, 0 6px 0 #4a2703, 0 14px 30px rgba(0, 0, 0, .55), 0 0 60px rgba(255, 215, 106, .25);
}
.bc-hero h1 span { display: block; color: var(--ink); font-size: .46em; letter-spacing: .28em; margin-left: .08em; margin-top: .22em;
  text-shadow: 0 2px 0 #7b2a9c, 0 4px 0 #3d145c, 0 10px 22px rgba(0, 0, 0, .6); }
.bc-hero p { margin: 18px 0 0; max-width: 46ch; color: var(--mute); font-size: 16px; }
.bc-hero p b { color: var(--ink); }
.bc-moon {
  width: clamp(120px, 24vw, 250px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; position: relative;
  background:
    radial-gradient(circle at 68% 30%, rgba(190, 130, 40, .35) 0 9%, transparent 10%),
    radial-gradient(circle at 32% 62%, rgba(190, 130, 40, .3) 0 13%, transparent 14%),
    radial-gradient(circle at 60% 72%, rgba(190, 130, 40, .25) 0 6%, transparent 7%),
    radial-gradient(circle at 38% 32%, #fff6cf, #ffe18a 45%, #f3b33c 100%);
  box-shadow: 0 0 80px 20px rgba(255, 215, 106, .28), 0 0 200px 60px rgba(255, 180, 60, .14);
}
.bc-moon svg { position: absolute; fill: #1a0b2e; }
.bc-moon svg:nth-child(1) { width: 62%; left: 19%; top: 34%; animation: bc-flap 3.2s ease-in-out infinite; }
.bc-moon svg:nth-child(2) { width: 24%; left: -22%; top: 10%; fill: #2b1650; animation: bc-flap 2.6s ease-in-out -.8s infinite; }
.bc-moon svg:nth-child(3) { width: 17%; left: 88%; top: 78%; fill: #2b1650; animation: bc-flap 2.2s ease-in-out -1.4s infinite; }
@keyframes bc-flap { 50% { transform: translateY(-7%) scaleY(.82); } }

.bc-claim {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-top: 22px;
}
.bc-btn {
  height: 50px; padding-inline: 22px; border-radius: 14px;
  font-family: var(--f-display); font-size: 17px; letter-spacing: .03em; color: #3b1d00;
  background: linear-gradient(180deg, #fff0a8, var(--moon) 40%, var(--moon-deep));
  box-shadow: 0 4px 0 #9a5a07, 0 10px 22px rgba(0, 0, 0, .45);
  transition: transform .08s, box-shadow .08s, filter .15s;
}
.bc-btn:hover { filter: brightness(1.08); }
.bc-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #9a5a07, 0 4px 10px rgba(0, 0, 0, .45); }
.bc-btn:disabled { filter: grayscale(.9) brightness(.6); transform: none; }
.bc-btn.ghost { background: var(--glass); color: var(--ink); box-shadow: 0 0 0 1px var(--line) inset; }
.bc-claim small { color: var(--mute); font-size: 13px; }
.bc-claim small b { color: var(--ecto); font-family: var(--f-num); }

.bc-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; margin-block: 4px 30px;
  border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--line); }
.bc-strip div { background: rgba(22, 12, 40, .9); padding: 12px 14px; min-width: 0; }
.bc-strip dt { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); font-weight: 700; }
.bc-strip dd { margin: 2px 0 0; font-family: var(--f-num); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 640px) { .bc-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } .bc-hero { grid-template-columns: minmax(0, 1fr); padding-block: 24px 22px; } .bc-moon { position: absolute; right: -8px; top: 14px; width: 112px; opacity: .92; z-index: 0; } .bc-hero > div:first-child { position: relative; z-index: 1; } }

.bc-h2 { display: flex; align-items: baseline; gap: 12px; margin: 0 0 14px; font-family: var(--f-display); font-weight: 400; font-size: 26px; letter-spacing: .02em; }
.bc-h2 small { font-family: var(--f-body); font-size: 13px; color: var(--mute); font-weight: 600; }
.bc-shelf { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1040px) { .bc-shelf { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) { .bc-shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
.bc-card {
  display: flex; flex-direction: column; text-align: left; min-width: 0; position: relative;
  border-radius: 18px; overflow: hidden; background: #150b28;
  box-shadow: 0 0 0 1px var(--line), 0 14px 30px rgba(0, 0, 0, .45);
  transition: transform .18s cubic-bezier(.2, .9, .3, 1.4), box-shadow .18s;
}
.bc-card:hover, .bc-card:focus-visible { transform: translateY(-6px) scale(1.015); box-shadow: 0 0 0 2px var(--moon), 0 22px 44px rgba(0, 0, 0, .6), 0 0 40px rgba(255, 215, 106, .18); }
.bc-card .art { aspect-ratio: 4 / 5; width: 100%; display: block; position: relative; overflow: hidden; }
.bc-card .art svg { width: 100%; height: 100%; display: block; }
.bc-card .art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, .22) 50%, transparent 60%); transform: translateX(-120%); }
.bc-card:hover .art::after { transform: translateX(120%); transition: transform .7s; }
.bc-card .meta { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bc-card .meta b { font-family: var(--f-display); font-weight: 400; font-size: 16px; letter-spacing: .02em; line-height: 1.15; }
.bc-card .meta span { font-size: 12.5px; color: var(--mute); line-height: 1.3; }
.bc-card .meta em { font-style: normal; font-family: var(--f-num); font-size: 12px; color: var(--ecto); margin-top: 4px; }
.bc-tag { position: absolute; left: 10px; top: 10px; z-index: 2; padding: 3px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; background: rgba(10, 5, 20, .78); border: 1px solid var(--line); color: var(--moon); }
.bc-foot { margin-top: 34px; color: var(--mute); font-size: 12.5px; max-width: 70ch; }
.bc-foot b { color: var(--ink); }

/* ---------- shared widgets ---------- */
.bc-stake { display: inline-flex; align-items: center; gap: 6px; }
.bc-stake button { width: 38px; height: 38px; border-radius: 50%; background: var(--glass); border: 1px solid var(--line); font-weight: 800; font-size: 20px; line-height: 1; }
.bc-stake button:hover:not(:disabled) { background: rgba(255, 255, 255, .14); }
.bc-stake button:disabled { opacity: .35; }
.bc-stake output { min-width: 92px; text-align: center; font-family: var(--f-num); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.05; }
.bc-stake output small { display: block; font-family: var(--f-body); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); font-weight: 700; }

.bc-toasts { position: fixed; left: 0; right: 0; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 10px); z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding-inline: 16px; }
.bc-toast { padding: 10px 16px; border-radius: 12px; background: #2a1550; border: 1px solid rgba(255, 215, 106, .5); box-shadow: 0 10px 30px rgba(0, 0, 0, .5); font-weight: 700; font-size: 14px; animation: bc-toast-in .3s cubic-bezier(.2, .9, .3, 1.4); max-width: 100%; }
.bc-toast.out { opacity: 0; transform: translateY(-8px); transition: .3s; }
@keyframes bc-toast-in { from { opacity: 0; transform: translateY(-14px) scale(.9); } }

.bc-fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 80; }

.bc-veil { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: rgba(8, 4, 16, .78); backdrop-filter: blur(4px); animation: bc-fade .2s; }
@keyframes bc-fade { from { opacity: 0; } }
.bc-modal { width: min(680px, 100%); max-height: min(86%, 760px); display: flex; flex-direction: column; border-radius: 20px; background: linear-gradient(180deg, #25123f, #170c2b); border: 1px solid rgba(255, 215, 106, .35); box-shadow: 0 30px 80px rgba(0, 0, 0, .7); overflow: hidden; }
.bc-modal header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 12px 20px; border-bottom: 1px solid var(--line); }
.bc-modal header h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--moon); }
.bc-modal .body { padding: 16px 20px 22px; overflow-y: auto; min-width: 0; }
.bc-modal .body h3 { font-family: var(--f-display); font-weight: 400; font-size: 16px; margin: 18px 0 6px; color: var(--ink); letter-spacing: .02em; }
.bc-modal .body h3:first-child { margin-top: 0; }
.bc-modal .body p, .bc-modal .body li { color: #d9cdee; font-size: 14px; }
.bc-modal .body p { margin: 0 0 8px; }
.bc-modal .body ul { margin: 0 0 8px; padding-left: 18px; }
.bc-modal .body table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; margin-bottom: 8px; }
.bc-modal .body th, .bc-modal .body td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
.bc-modal .body th { color: var(--mute); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.bc-modal .body .rtp { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: rgba(88, 240, 200, .08); border: 1px solid rgba(88, 240, 200, .3); color: var(--ecto); font-size: 13px; }

.bc-win { position: fixed; inset: 0; z-index: 75; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, rgba(107, 63, 209, .55), rgba(8, 4, 16, .9) 65%); animation: bc-fade .25s; cursor: pointer; padding: 16px; text-align: center; overflow: hidden; }
.bc-win::before { content: ''; position: absolute; width: 180vmax; height: 180vmax; left: 50%; top: 45%; translate: -50% -50%; background: repeating-conic-gradient(rgba(255, 215, 106, .13) 0 9deg, transparent 9deg 18deg); animation: bc-rays 18s linear infinite; }
@keyframes bc-rays { to { rotate: 360deg; } }
.bc-win > div { position: relative; }
.bc-win h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(40px, 11vw, 110px); line-height: .95; color: var(--moon); text-wrap: balance;
  text-shadow: 0 3px 0 #c9860f, 0 7px 0 #8a4f06, 0 9px 0 #4a2703, 0 18px 40px rgba(0, 0, 0, .6), 0 0 70px rgba(255, 215, 106, .5);
  animation: bc-slam .55s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes bc-slam { from { transform: scale(3); opacity: 0; } }
.bc-win output { display: block; margin-top: 14px; font-family: var(--f-num); font-weight: 700; font-size: clamp(34px, 8vw, 76px); font-variant-numeric: tabular-nums; color: #fff; text-shadow: 0 4px 0 rgba(0, 0, 0, .5), 0 0 30px rgba(255, 255, 255, .4); }
.bc-win p { margin: 8px 0 0; color: var(--mute); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .bc-win::before, .bc-moon svg { animation: none; } }

/* ---------- install as an app ---------- */
.bc-getapp { display: flex; align-items: center; gap: 14px; margin: 0 0 22px; padding: 14px 16px; border-radius: 18px;
  background: linear-gradient(110deg, rgba(255, 215, 106, .16), rgba(107, 63, 209, .22)); border: 1px solid rgba(255, 215, 106, .35);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .08); }
.bc-getapp .ic { flex: none; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center;
  background: radial-gradient(circle at 45% 40%, #fff2bd, #ffd76a 55%, #f5a623); }
.bc-getapp .ic svg { width: 34px; fill: #130a22; }
.bc-getapp div { flex: 1; min-width: 0; display: grid; gap: 2px; }
.bc-getapp div b { font-family: var(--f-display); font-weight: 400; font-size: 17px; letter-spacing: .02em; color: var(--moon); }
.bc-getapp div span { font-size: 13.5px; color: var(--mute); }
.bc-getapp .bc-btn { flex: none; }
.bc-getapp .x { flex: none; width: 32px; height: 32px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .08); cursor: pointer; display: grid; place-items: center; }
.bc-getapp .x svg { width: 16px; stroke: var(--ink); stroke-width: 2.4; fill: none; stroke-linecap: round; }
.bc-inst-btn svg { stroke: var(--moon) !important; }
.bc-inst ol { padding-left: 1.3em; line-height: 1.7; }
@media (max-width: 560px) { .bc-getapp { flex-wrap: wrap; } .bc-getapp div { flex-basis: calc(100% - 110px); } .bc-getapp .bc-btn { flex: 1; } }

/* ---------- online: shared bits ---------- */
.bc-loading { flex: 1; display: grid; place-items: center; align-content: center; gap: 10px; min-height: 60vh; color: var(--mute); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; text-align: center; padding-inline: 16px; }
.bc-loading span svg { width: 70px; height: 34px; fill: var(--moon); animation: bc-flap 1.2s ease-in-out infinite; }
.bc-loading.err b { color: var(--fang); font-size: 18px; text-transform: none; letter-spacing: 0; }
.bc-loading.err span { text-transform: none; letter-spacing: 0; font-weight: 500; max-width: 50ch; }
.bc-me { width: 40px; height: 40px; flex: none; border-radius: 50%; padding: 0; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--moon); }
.bc-me svg { display: block; border-radius: 50%; }
.bc-btn.busy { opacity: .7; cursor: progress; }
.ol-name { color: var(--ink); font-weight: 800; text-decoration: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ol-name:hover { color: var(--moon); text-decoration: underline; }
.ol-empty { color: var(--mute); font-size: 14px; margin: 6px 0; }
.ol-err { color: #ff7aa8; font-size: 13.5px; font-weight: 600; margin: 0; min-height: 0; }
.ol-err:empty { display: none; }
.bc-lobby input, .pg input, .ol-select { font: inherit; color: var(--ink); background: rgba(10, 5, 20, .7); border: 1px solid rgba(255, 255, 255, .18); border-radius: 12px; padding: 11px 13px; min-width: 0; width: 100%; }
.bc-lobby input:focus, .pg input:focus, .ol-select:focus { outline: 2px solid var(--moon); outline-offset: 1px; border-color: transparent; }

<div id="batty-app"></div>
<script>
/* Batty Casino core: wallet, RNG, audio, effects, shell and lobby. Games register themselves with Batty.registerGame(). */
window.Batty = (function () {
  'use strict';

  const BAT = 'M60 18C57 10 55 8 53 4c-1 5-2 8-1 12C40 8 22 8 4 16c8 2 12 8 13 16 5-5 11-5 15 1 4-5 10-4 13 3 5 6 11 10 15 18 4-8 10-12 15-18 3-7 9-8 13-3 4-6 10-6 15-1 1-8 5-14 13-16C98 8 80 8 68 16c1-4 0-7-1-12-2 4-4 6-7 14Z';
  const batSvg = (cls) => '<svg viewBox="0 0 120 58" aria-hidden="true"' + (cls ? ' class="' + cls + '"' : '') + '><path d="' + BAT + '"/></svg>';

  /* ---------- tiny DOM helper ---------- */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
    return el;
  }

  /* ---------- persistence (per-browser; falls back to memory) ---------- */
  const KEY = 'batty-casino-v1';
  const START_BALANCE = 25000;
  const state = { bal: START_BALANCE, wagered: 0, level: 1, lastClaim: 0, muted: false, stats: {}, prefs: {} };
  try { const raw = localStorage.getItem(KEY); if (raw) Object.assign(state, JSON.parse(raw)); } catch (e) { /* memory only */ }
  if (!(state.bal >= 0)) state.bal = START_BALANCE;
  let saveT = 0;
  function save() {
    if (saveT) return;
    saveT = setTimeout(() => { saveT = 0; try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* memory only */ } }, 60);
  }

  /* ---------- RNG (crypto-backed, uniform in [0,1)) ---------- */
  const pool = new Uint32Array(256); let poolI = 256;
  function rng() {
    if (poolI >= 256) { crypto.getRandomValues(pool); poolI = 0; }
    return pool[poolI++] / 4294967296;
  }
  const randInt = (n) => Math.floor(rng() * n);
  function pickWeighted(items, weightOf) {
    const w = weightOf || ((x) => x.w);
    let total = 0; for (const it of items) total += w(it);
    let r = rng() * total;
    for (const it of items) { r -= w(it); if (r < 0) return it; }
    return items[items.length - 1];
  }

  /* ---------- wallet ----------
     Two modes. Practice (no server): the balance lives in this browser. Online (api.php answered): the server owns the
     balance; bet() books the stake as "pending" until the server's reply arrives with the authoritative balance. */
  const STAKES = [20, 40, 100, 200, 400, 1000, 2000, 5000, 10000];
  const subs = new Set();
  let shown = state.bal;
  const srv = { on: false, bal: 0, ver: -1, pending: 0, level: 1, xp: 0, me: null, site: null };
  const statOf = (id) => state.stats[id] || (state.stats[id] = { rounds: 0, wagered: 0, won: 0, best: 0 });
  const levelFloor = (L) => Math.round(10000 * Math.pow(L - 1, 1.6));
  const realBal = () => (srv.on ? srv.bal - srv.pending : state.bal);
  function emit() { if (!srv.on) save(); subs.forEach((f) => { try { f(shown, realBal()); } catch (e) { console.error(e); } }); }
  const deferred = [];
  /* this visit's totals, for the reality check */
  const session = { t0: Date.now(), bet: 0, won: 0 };
  const wallet = {
    get balance() { return realBal(); },   // real balance (includes winnings not yet shown)
    get shown() { return shown; },         // what the player currently sees
    get online() { return srv.on; },
    canBet(amount) { return amount > 0 && realBal() >= amount; },
    /* Take a stake. Returns false (and takes nothing) if the player cannot afford it. */
    bet(id, amount) {
      amount = Math.round(amount);
      if (!(amount > 0) || realBal() < amount) return false;
      session.bet += amount;
      if (srv.on) { srv.pending += amount; shown -= amount; emit(); return true; }
      state.bal -= amount; shown -= amount;
      const s = statOf(id); s.rounds++; s.wagered += amount; state.wagered += amount;
      while (state.wagered >= levelFloor(state.level + 1)) {
        state.level++;
        const gift = 500 * state.level;
        state.bal += gift; shown += gift;
        setTimeout(() => { ui.toast('Level ' + state.level + '! +' + fmt(gift) + ' Batty Bucks'); sfx('level'); }, 400);
      }
      emit(); return true;
    },
    /* Credit a win. {silent:true} banks it straight away but keeps the on-screen balance where it is
       until wallet.sync(). Online, the server has already paid it, so this only moves the display. */
    win(id, amount, opts) {
      amount = Math.round(amount);
      if (!(amount > 0)) return 0;
      session.won += amount;
      if (!srv.on) { state.bal += amount; const s = statOf(id); s.won += amount; if (amount > s.best) s.best = amount; }
      if (!(opts && opts.silent)) shown = realBal();
      emit(); return amount;
    },
    sync() { if (shown !== realBal()) { shown = realBal(); emit(); } flushEvents(); },
    /* Hand back a stake taken with bet() that was never sent to the server (or never played). */
    unbet(amount) {
      amount = Math.round(amount); if (!(amount > 0)) return;
      session.bet = Math.max(0, session.bet - amount);
      if (srv.on) srv.pending = Math.max(0, srv.pending - amount); else state.bal += amount;
      shown += amount; emit();
    },
    on(fn) { subs.add(fn); return () => subs.delete(fn); },
    stats: statOf,
  };

  /* ---------- server ---------- */
  function applyServer(r, cost) {
    if (cost) srv.pending = Math.max(0, srv.pending - cost);
    if (r && typeof r.bal === 'number' && r.ver >= srv.ver) { srv.bal = r.bal; srv.ver = r.ver; }
    if (r && typeof r.level === 'number') { srv.level = r.level; srv.xp = r.xp || 0; }

        adm.onclick = async () => { try { await B.api('admin_set', { id, field: 'is_admin', on: !+u.is_admin }); user(id); users(); } catch (e) { B.ui.toast(e.message); } };
        const np = h('input', { id: 'ad-np', type: 'text', placeholder: 'New password (6+ characters)' });
        const npb = h('button', { class: 'bc-btn ghost', type: 'button' }, 'Set password');
        npb.onclick = async () => { try { await B.api('admin_password', { id, pass: np.value }); np.value = ''; B.ui.toast('Password changed and their sessions ended.'); } catch (e) { B.ui.toast(e.message); } };
        const led = h('div', { class: 'pf-table ad-ledger' }, h('div', { class: 'tr th' }, h('span', null, 'When'), h('span', null, 'What'), h('span', null, 'Amount'), h('span', null, 'Balance')));
        for (const l of r.ledger) led.append(h('div', { class: 'tr' }, h('span', null, new Date(l.created_at.replace(' ', 'T').slice(0, 19) + 'Z').toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })), h('span', null, l.kind + (l.game ? ' · ' + GS[l.game] : '') + (l.note ? ' · ' + l.note : '')), h('span', { class: +l.amount < 0 ? 'neg' : 'pos' }, (+l.amount > 0 ? '+' : '') + fmt(+l.amount)), h('span', null, fmt(+l.balance))));
        detail.append(h('header', null, h('h3', null, u.username), h('a', { href: '#profile/' + encodeURIComponent(u.username) }, 'Public profile')),
          h('p', { class: 'pg-sub' }, 'Balance ' + fmt(+u.balance) + ' · level ' + u.level + ' · ' + fmt(+u.rounds) + ' rounds · joined ' + u.created_at.slice(0, 10)),
          h('div', { class: 'ad-row' }, amt, note, adj), h('div', { class: 'ad-row' }, ban, adm, np, npb), h('b', null, 'Ledger (last 100)'), h('div', { class: 'pf-scroll' }, led));
        detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      /* feed moderation */
      async function feed() {
        const r = await B.api('feed', { since: 0 }); if (dead) return;
        feedBox.textContent = '';
        feedBox.append(h('header', null, h('h2', null, 'Big-wins feed'), h('small', null, 'Remove anything you don’t want in the lobby')));
        if (!r.items.length) feedBox.append(h('p', { class: 'ol-empty' }, 'The feed is empty.'));
        for (const it of r.items) {
          const del = h('button', { class: 'bc-btn ghost', type: 'button' }, 'Remove');
          del.onclick = async () => { try { await B.api('admin_feed_delete', { id: it.id }); feed(); } catch (e) { B.ui.toast(e.message); } };
          feedBox.append(h('div', { class: 'ad-feed' }, h('span', null, it.name + ' won ' + fmt(it.amount) + ' BB (' + xs(it.x) + ') on ' + GS[it.game] + ', ' + ago(it.at)), del));
        }
      }
      stats().catch((e) => B.ui.toast(e.message)); users().catch((e) => B.ui.toast(e.message)); feed().catch(() => {});
      return { destroy() { dead = true; } };
    },
  });
})();
